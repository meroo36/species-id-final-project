[project]
name = "species-id"
version = "0.2.0"
description = "Species identification from photographs - MLOps project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "python-dotenv>=1.0",
    "mlflow>=2.20,<3",
    "dvc>=3.50",
    "pyyaml>=6",
    "evidently>=0.6,<0.7",
    "prometheus-fastapi-instrumentator>=7",
    "pandas>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/species_id"]

# CPU-only PyTorch on Linux keeps the Docker image small (no CUDA libraries).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
